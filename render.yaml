services:
  - type: web
    name: forme-salon-marketplace
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm --prefix server ci
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SESSION_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_BOOTSTRAP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: forme-postgres
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: forme-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: forme_platform
    user: forme_app
